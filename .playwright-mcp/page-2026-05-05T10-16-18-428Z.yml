            - heading "Four Reasons to Love a Fortnum’s Hamper" [level=2] [ref=e1453]
            - link "Shop All Hampers " [ref=e1456] [cursor=pointer]:
              - /url: /hampers/all-hampers
            - generic [ref=e1458]:
              - generic [ref=e1459]:
                - figure [ref=e1460]:
                  - img "Content image" [ref=e1462]
                - paragraph [ref=e1464]:
                  - generic [ref=e1465]: Historically Extraordinary
                - paragraph [ref=e1467]: The original parcel of joy, we filled our first hamper in the 1730s — and three centuries later, they’re still the world’s finest.
              - generic [ref=e1468]:
                - figure [ref=e1469]:
                  - img "Content image" [ref=e1471]
                - paragraph [ref=e1473]: Deliciously Generous
                - paragraph [ref=e1475]: Expertly curated to surprise and delight, the price of every Fortnum’s hamper is always less than the cost of buying its basket and contents separately.
              - generic [ref=e1476]:
                - figure [ref=e1477]:
                  - img "Content image" [ref=e1479]
                - paragraph [ref=e1481]: Forever Ready
                - paragraph [ref=e1483]: Beautifully made and built to last, our wickers can be repurposed into just about anything your imagination can conceive.
              - generic [ref=e1484]:
                - figure [ref=e1485]:
                  - img "Content image" [ref=e1487]
                - paragraph [ref=e1489]: The Best Gift
                - paragraph [ref=e1491]: For centuries, our hampers have made happy occasions and landmark moments all the more memorable. No other present can possibly compare!
          - generic [ref=e1496]:
            - figure [ref=e1501]:
              - iframe [ref=e1503]:
                
            - generic [ref=e1504]:
              - heading "Our Parcels of Joy" [level=2] [ref=e1506]
              - paragraph [ref=e1508]: The buckles. The straps. The handle. The lid. The expertly-stencilled monogram. Those simple ingredients - and the delicious things that make it inside each hamper too - are what make ours the most extraordinary in the world. All of our wicker is hand-woven from willow too, a naturally sustainable material that regrows once harvested.
          - generic [ref=e1516]:
            - generic [ref=e1518]:
              - heading "Our Hamper Stories" [level=2] [ref=e1519]:
                - generic [ref=e1521]: Our Hamper Stories
              - paragraph [ref=e1522]: Instantly recognisable and treasured all over the world, our expertly crafted hampers have played a key role in the story of Fortnum's. Lift the lid on the latest about our beloved parcels of joy.
            - generic [ref=e1523]:
              - generic [ref=e1525]:
                - figure [ref=e1526]:
                  - link "Content image":
                    - /url: /stories/history-of-the-hamper
                    - generic:
                      - img "Content image"
                - paragraph [ref=e1528]:
                  - generic [ref=e1529]: History of the Hamper
                - paragraph [ref=e1531]: Fortnum’s first hampers were created in the late 1730s for well-heeled customers journeying to their country estates. Now? They're a by-word for portable pleasure, enjoyed across the globe. Disover more about their story.
                - link "Read more " [ref=e1534] [cursor=pointer]:
                  - /url: https://www.fortnumandmason.com/stories/history-of-the-hamper
              - generic [ref=e1536]:
                - figure [ref=e1537]:
                  - link "Content image" [ref=e1538] [cursor=pointer]:
                    - /url: /stories/recycle-joy
                    - img "Content image" [ref=e1540]
                - paragraph [ref=e1542]: Our Wicker Recycling Service
                - paragraph [ref=e1544]: Our wicker hampers are famed for being repurposed in ever imaginative ways, but if you find yourself with one wicker too many, then why not let us recycle it?
                - link "Learn More " [ref=e1547] [cursor=pointer]:
